<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <style>
      body { font-family: system-ui, Arial, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; }
      form { display: flex; gap: 8px; margin-bottom: 16px; }
      input[type="text"] { flex: 1; padding: 8px; }
      button { padding: 8px 12px; cursor: pointer; }
      .filters { display: flex; gap: 8px; margin-bottom: 16px; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #ddd; }
      .done { text-decoration: line-through; color: #777; }
      .actions { display: flex; gap: 8px; }
    </style>
  </head>
  <body>
    <h1>Todo App</h1>

    <form id="todo-form">
      <input id="title" type="text" placeholder="Add a todo" required />
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button data-filter="all">All</button>
      <button data-filter="false">Incomplete</button>
      <button data-filter="true">Completed</button>
    </div>

    <ul id="list"></ul>

    <script>
      const list = document.getElementById('list');
      const form = document.getElementById('todo-form');
      const titleInput = document.getElementById('title');
      let filter = 'all';

      async function loadTodos() {
        const qs = filter === 'all' ? '' : `?completed=${filter}`;
        const res = await fetch(`/api/todos${qs}`);
        const todos = await res.json();

        list.innerHTML = '';
        for (const todo of todos) {
          const li = document.createElement('li');

          const span = document.createElement('span');
          span.textContent = todo.title;
          if (todo.completed) span.className = 'done';

          const actions = document.createElement('div');
          actions.className = 'actions';

          if (!todo.completed) {
            const completeBtn = document.createElement('button');
            completeBtn.textContent = 'Complete';
            completeBtn.onclick = async () => {
              await fetch(`/api/todos/${todo.id}/complete`, { method: 'PATCH' });
              await loadTodos();
            };
            actions.appendChild(completeBtn);
          }

          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = 'Delete';
          deleteBtn.onclick = async () => {
            await fetch(`/api/todos/${todo.id}`, { method: 'DELETE' });
            await loadTodos();
          };
          actions.appendChild(deleteBtn);

          li.appendChild(span);
          li.appendChild(actions);
          list.appendChild(li);
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const title = titleInput.value.trim();
        if (!title) return;

        await fetch('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });

        titleInput.value = '';
        await loadTodos();
      });

      document.querySelectorAll('[data-filter]').forEach((button) => {
        button.addEventListener('click', async () => {
          filter = button.getAttribute('data-filter');
          await loadTodos();
        });
      });

      loadTodos();
    </script>
  </body>
</html>
